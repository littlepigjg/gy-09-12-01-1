services:
  mysql:
    image: mysql:8.0
    container_name: risk-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: risk_control
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    ports:
      - "3308:3306"          # 宿主机 3308 -> 容器 3306（避开宿主机已占用的 3306）
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    image: risk-control:latest
    container_name: risk-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: risk_control
      PORT: 8000
      HOT_RELOAD_INTERVAL: 2.0
    ports:
      - "8002:8000"          # 宿主机 8002 -> 容器 8000

volumes:
  mysql_data:
